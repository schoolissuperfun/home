<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <title>Site not found &middot; GitHub Pages</title>
    <style type="text/css" media="screen">
      body {
        background-color: #f1f1f1;
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .container { margin: 50px auto 40px auto; width: 600px; text-align: center; }

      a { color: #4183c4; text-decoration: none; }
      a:hover { text-decoration: underline; }

      h1 { width: 800px; position:relative; left: -100px; letter-spacing: -1px; line-height: 60px; font-size: 60px; font-weight: 100; margin: 0px 0 50px 0; text-shadow: 0 1px 0 #fff; }
      p { color: rgba(0, 0, 0, 0.5); margin: 20px 0; line-height: 1.6; }

      #suggestions {
        margin-top: 35px;
        color: #ccc;
        margin-bottom: 25px;
      }
      #suggestions a {
        color: #666666;
        font-weight: 200;
        font-size: 14px;
        margin: 0 10px;
      }

      /* GitHub Logo Styling */
      .footer-logo {
        display: inline-block;
        margin-top: 10px;
        opacity: 0.15; /* Subtle grey look to match the original */
        transition: opacity 0.2s;
        vertical-align: middle;
      }

      .footer-logo:hover {
        opacity: 0.4;
      }

    </style>
  </head>
  <body>

    <div class="container">

      <h1>404</h1>
      <p><strong>There isn't a GitHub Pages site here.</strong></p>

      <p>
        If you're trying to publish one,
        <a href="https://help.github.com/pages/">read the full documentation</a>
        to learn how to set up <strong>GitHub Pages</strong>
        for your repository, organization, or user account.
      </p>

      <div id="suggestions">
        <a href="https://githubstatus.com">GitHub Status</a> &mdash;
        <a href="javascript:void(0);" onclick="var win = window.open('about:blank'); win.document.title = 'Classroom'; win.document.body.style.margin = '0'; var iframe = win.document.createElement('iframe'); iframe.style.border = 'none'; iframe.style.width = '100%'; iframe.style.height = '100%'; iframe.src = 'https://schoolissuperfun.github.io/realhome'; win.document.body.appendChild(iframe); return false;" style="text-decoration: none;">ClickHere4Games</a>
      </div>

      <a href="/">
        <img src="GitHub.png" width="32" height="32" class="footer-logo" alt="GitHub Logo">
      </a>
      
    </div>
  </body>
</html>
